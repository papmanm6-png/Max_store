<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEKTA Store</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,400;1,500&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--c:#483D8B;--bg:color-mix(in srgb,var(--c) 16%,#050410);--bg2:color-mix(in srgb,var(--c) 75%,#050410);--p:color-mix(in srgb,var(--c) 28%,#050410);--p2:color-mix(in srgb,var(--c) 38%,#050410);--ln:color-mix(in srgb,var(--c) 70%,#000);--tx:#f0edff;--mu:#a59fcf;--ac:var(--acd,#b3a7ff);--ac2:var(--acd2,#d8d1ff);--bt:var(--c);--bt2:color-mix(in srgb,var(--c) 80%,#fff);--er:#ff8a8f;--ok:#5ad6a0;--hd:var(--c)}
[data-theme=light]{--bg:#f3f1fb;--bg2:#ddd7f4;--p:#ffffff;--p2:#f4f1fc;--ln:#d3cbee;--tx:#1c1740;--mu:#665f94;--ac:var(--c);--ac2:#cfc6fa;--hd:#ffffff}
[data-theme=light] .btn.pri{background:var(--c);color:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,var(--bg2),var(--bg) 60%) fixed var(--bg);color:var(--tx);min-height:100vh;padding-bottom:90px;line-height:1.5}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button,a,[data-act]{touch-action:manipulation;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.hd{position:sticky;top:0;z-index:20;background:var(--hd);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.02em;font-size:20px}
.brand b,.abrand b{color:var(--ac)}
.lg{width:50px;height:50px;border-radius:14px;background:#fff;color:var(--c);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.04em;border:2px solid var(--ac2)}
.hr{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ln);background:transparent;border-radius:16px;padding:14px 20px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--ac)}
.btn.sm{padding:10px 14px;border-radius:12px;font-size:14px}
.btn.fill{background:var(--bt);border-color:var(--bt);color:#fff}
.btn.fill:hover{background:var(--bt2)}
.btn.pri{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#1b1540;border:0;font-weight:800}
.btn.block{width:100%}
.btn.dng{color:var(--er)}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);border-radius:14px;padding:8px 16px 8px 8px;font-weight:700;background:color-mix(in srgb,var(--ac) 6%,transparent)}
.chip i{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);display:grid;place-items:center;font-style:normal}
.ico{width:46px;height:46px;border-radius:14px;border:1px solid var(--ln);background:color-mix(in srgb,var(--ac) 8%,transparent);color:var(--tx);cursor:pointer;font-size:20px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:26px;padding:24px}
h1.h,h2.h{font-family:'Playfair Display',serif;font-weight:800;line-height:1.1}
h1.h{font-size:clamp(32px,6vw,46px)}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--ac);font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:22px 0 10px}
.eyebrow:before{content:"";width:34px;height:2px;background:var(--ac)}
.mu{color:var(--mu)}
.mono,.pr{font-family:'JetBrains Mono',monospace;font-weight:700}
.pr{color:var(--ac)}
main{padding-top:6px;padding-bottom:20px}
.ft{border-top:1px solid var(--ln);margin-top:40px;padding:30px 0 120px;text-align:center;display:grid;gap:4px;color:var(--mu);font-size:14px}
.ft b{color:var(--ac);letter-spacing:.1em;cursor:pointer;user-select:none}
.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--hd);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px 12px}
.bn a{display:grid;justify-items:center;gap:3px;font-size:13px;font-weight:600;color:var(--mu);padding:8px 0;border-radius:14px}
.bn a.on{color:var(--ac)}
.bn a.on svg{background:color-mix(in srgb,var(--ac) 18%,transparent);padding:10px;width:46px;height:46px;border-radius:14px;margin:-8px 0 -4px}
.fab{position:fixed;right:18px;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;z-index:25;box-shadow:0 8px 24px rgba(0,0,0,.35);border:0;cursor:pointer}
.fab.wa{bottom:100px;background:#25d366;color:#fff}
.fab.ct{bottom:168px;background:var(--bt);color:#fff;display:none}
.fab.ct.on{display:grid}
.hero{text-align:center;padding:34px 0 10px}
.tagp{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ln);background:color-mix(in srgb,var(--ac) 10%,transparent);border-radius:99px;padding:12px 22px;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ac2)}
.tagp:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ac)}
.orb{width:230px;height:230px;border-radius:50%;margin:34px auto -60px;display:grid;place-items:center;font-size:84px;background:radial-gradient(circle,var(--c),var(--p) 72%);border:10px solid color-mix(in srgb,var(--ac) 18%,transparent);position:relative;z-index:1}
.hcard{padding:80px 26px 30px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 60%,#050410),var(--p));border-radius:34px;border:1px solid var(--ln)}
[data-theme=light] .hcard{background:linear-gradient(180deg,#fff,var(--p2))}
.hcard h1{font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(40px,9vw,64px);line-height:1.1;margin-bottom:18px}
.hcard h1 em{color:var(--ac);font-style:italic}
.hcard p{max-width:520px;margin:0 auto 26px;font-size:20px}
.cta{display:grid;gap:14px;max-width:520px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:34px;padding-top:26px;border-top:1px solid var(--ln)}
.stats b{display:block;font-family:'Playfair Display',serif;font-size:42px;font-weight:400}
.stats span{font-size:13px;letter-spacing:.14em;color:var(--mu);text-transform:uppercase}
.feats{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:26px 0}
.feats span{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--ln);border-radius:99px;padding:10px 18px;font-weight:600;font-size:15px}
.feats svg{color:var(--ac)}
.sh{text-align:center;margin:34px 0 14px}
.sh small{display:block;color:var(--ac);letter-spacing:.2em;font-weight:700;font-size:13px;margin-bottom:6px}
.sh h2{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:34px}
.news{display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory}
.nw{flex:0 0 min(78%,420px);height:280px;border-radius:26px;border:1px solid var(--ln);overflow:hidden;position:relative;scroll-snap-align:start;background-size:cover;background-position:center;display:flex;align-items:flex-end}
.nw i{font-family:'Playfair Display',serif;font-size:26px;padding:20px;background:linear-gradient(transparent,rgba(0,0,0,.75));width:100%;color:#fff}
.nw .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:90px}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0}
.cp{border:1px solid var(--ln);background:var(--p);border-radius:16px;padding:14px 24px;font-weight:700;cursor:pointer}
.cp.on{background:var(--bt2);border-color:var(--bt2);color:#fff;box-shadow:0 0 22px color-mix(in srgb,var(--ac) 25%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.pc{background:var(--p);border:1px solid var(--ln);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.art{aspect-ratio:4/3;background-size:cover;background-position:center;display:grid;place-items:center;font-size:72px;font-weight:800;position:relative;overflow:hidden}
.art.big{aspect-ratio:16/10;border-radius:22px;margin-bottom:22px;font-size:110px}
.pc .tg{position:absolute;top:14px;left:14px;background:#fff;color:#2b2460;font-weight:700;font-size:12px;letter-spacing:.08em;padding:6px 14px;border-radius:99px;text-transform:uppercase;z-index:2}
.pb{padding:20px 22px 22px;display:grid;gap:14px;flex:1;align-content:space-between}
.pb h3{font-size:20px;font-weight:600}
.pb .ds{color:var(--mu);font-size:15px;margin-top:-8px}
.pr-row{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:13px;letter-spacing:.1em}
.pr-row .pr{font-size:16px;color:var(--tx)}
.back{display:inline-block;color:var(--ac);font-weight:700;letter-spacing:.06em;margin:18px 0 14px;font-size:15px}
.tag{display:inline-block;border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent);border-radius:99px;padding:8px 18px;font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--ac);text-transform:uppercase;margin-bottom:10px}
.pcard h1{font-size:34px;font-family:'Playfair Display',serif;font-weight:700;margin-bottom:8px}
.sec{margin-top:22px}
.sec h4{font-size:14px;letter-spacing:.16em;color:var(--ac2);margin-bottom:14px;text-transform:uppercase}
.sec h5{font-size:14px;letter-spacing:.12em;color:var(--mu);margin:14px 0 10px;text-transform:uppercase}
.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.of{text-align:left;background:var(--p2);border:1px solid var(--ln);border-radius:18px;padding:18px 20px;cursor:pointer;display:grid;gap:6px;font-size:17px}
.of b{font-weight:700}
.of.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset;background:color-mix(in srgb,var(--ac) 14%,transparent)}
.lab{display:block;font-weight:800;font-size:14px;letter-spacing:.06em;margin:18px 0 8px;text-transform:uppercase}
.lab i{color:var(--ac);font-style:normal}
.in{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--ln);border-radius:18px;padding:18px 20px;outline:0;font-size:17px}
[data-theme=light] .in{background:#f4fafc}
.in:focus{border-color:var(--ac)}
.hint{font-size:14px;color:var(--mu);margin-top:8px}
.tot{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;margin:6px 0 18px}
.tot small{font-size:16px;color:var(--ac)}
.acts{display:grid;gap:12px}
.tbl{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:15px;margin-top:18px}
.tbl th{font-family:Manrope;font-size:13px;letter-spacing:.1em;color:var(--mu);text-align:left;padding:12px 8px;text-transform:uppercase}
.tbl td{padding:14px 8px;border-top:1px solid var(--ln)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.sum div{background:var(--p2);border:1px solid var(--ln);border-radius:18px;padding:16px 18px}
.sum small{display:block;font-size:12px;letter-spacing:.12em;color:var(--mu);text-transform:uppercase}
.sum b{font-family:'JetBrains Mono',monospace;font-size:20px}
.auth{max-width:520px;margin:0 auto;padding:40px 20px;position:relative}
.auth .th{position:absolute;right:20px;top:20px}
.abrand{text-align:center;border-radius:30px;padding:40px 20px 34px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));border:4px solid rgba(255,255,255,.07);margin:70px 0 26px}
.abrand .lg{width:112px;height:112px;margin:0 auto 14px;border-radius:50%;font-size:20px}
.abrand h2{font-size:30px;font-weight:800;color:#fff}
.abrand p{color:#e4e0ff}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--ln);margin-bottom:22px}
.tabs button{background:0;border:0;padding:18px;font-weight:700;color:var(--mu);border-bottom:3px solid transparent;cursor:pointer;font-size:18px}
.tabs button.on{color:var(--tx);border-color:var(--ac)}
.iw{position:relative}
.iw>svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--mu)}
.iw .in{padding-left:54px}
.iw .eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:0;border:0;color:var(--mu);cursor:pointer;padding:6px}
.or{display:flex;align-items:center;gap:14px;color:var(--mu);margin:18px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--ln)}
.lnk{background:0;border:0;color:var(--ac);font-weight:700;cursor:pointer;margin-top:14px;display:block}
.foot{text-align:center;color:var(--mu);margin-top:24px;font-size:14px}
.note{background:color-mix(in srgb,var(--ac) 10%,transparent);border:1px dashed var(--ac);border-radius:14px;padding:12px 14px;font-size:14px;margin-top:12px}
.empty{text-align:center;padding:50px 10px;color:var(--mu);display:grid;gap:18px;justify-items:center}
.empty .bx{width:118px;height:118px;border-radius:30px;background:var(--p2);border:1px solid var(--ln);display:grid;place-items:center;color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:14px;align-items:center}
.list{display:grid;gap:14px}
.it{background:var(--p);border:1px solid var(--ln);border-radius:20px;padding:18px 20px;display:grid;gap:8px}
.st{display:inline-block;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ln)}
.st.ok{color:var(--ok);border-color:var(--ok)}.st.wt{color:#e8b64a;border-color:#e8b64a}.st.no{color:var(--er);border-color:var(--er)}
.bal{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,#050410),var(--p));border:1px solid var(--ln);border-radius:22px;padding:24px 28px;margin:18px 0}
.bal span{letter-spacing:.14em;font-weight:700;color:var(--ac2);font-size:14px}
.bal b{font-family:'JetBrains Mono',monospace;font-size:34px}
.bal b small{font-size:14px;color:var(--ac)}
.meth{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.meth div{background:var(--p);border:1px solid var(--ln);border-radius:20px;padding:22px 8px;text-align:center;display:grid;gap:4px;justify-items:center}
.meth div svg{color:var(--mu)}
.meth div.on{border-color:var(--ac);background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 25%,transparent),var(--p))}
.meth div.on svg{color:var(--ac)}
.meth small{font-size:13px;color:var(--mu)}.meth small.bad{color:var(--er);font-weight:700}
.sect{display:flex;align-items:center;gap:10px;color:var(--ac2);letter-spacing:.14em;font-weight:800;font-size:14px;margin:30px 0 14px;text-transform:uppercase}
.sect:after{content:"";flex:1;height:1px;background:var(--ln)}
.avatar{width:92px;height:92px;border-radius:24px;background:linear-gradient(135deg,var(--ac2),var(--ac));display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:38px;font-weight:800;color:#1b1540;flex:none}
.bds{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;padding-top:18px;border-top:1px solid var(--ln)}
.bds span{border:1px solid var(--ln);border-radius:99px;padding:9px 16px;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--mu)}
.bds span.cl{color:var(--ac);border-color:var(--ac);font-family:Manrope;font-weight:800;letter-spacing:.08em;background:color-mix(in srgb,var(--ac) 10%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.two{grid-template-columns:1fr}.hd{padding:12px 14px}.chip span{display:none}.chip{padding:6px}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:grid;place-items:center;padding:16px;overflow:auto}
.mb{background:var(--p);border:1px solid var(--ln);border-radius:26px;padding:26px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.mb h3{font-family:'Playfair Display',serif;font-size:26px;margin-bottom:14px}
textarea.in{min-height:110px;resize:vertical;font-size:15px}
.mb .acts{margin-top:18px}
#tst{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:min(92vw,460px)}
.ts{background:var(--p);border:1px solid var(--ac);border-left-width:5px;border-radius:14px;padding:14px 18px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.ts.err{border-color:var(--er)}
.wheel{font-size:90px;text-align:center;padding:24px;background:var(--p2);border-radius:24px;border:1px solid var(--ln);margin:18px 0;font-family:'JetBrains Mono',monospace;font-weight:800}
.atabs{display:flex;gap:10px;overflow-x:auto;padding:6px 0 14px}
.atabs .cp{white-space:nowrap;padding:12px 18px}
img.pf{max-width:100%;border-radius:14px;border:1px solid var(--ln);max-height:260px;object-fit:contain}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
button,a,[data-act]{touch-action:manipulation}
.pill{position:fixed;left:14px;bottom:100px;z-index:25;background:var(--p);border:1px solid var(--ln);border-radius:20px;padding:0 18px 0 0;display:flex;align-items:center;gap:14px;color:var(--tx);cursor:pointer;height:70px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.pill.on{display:flex}
.pill .grip{height:100%;width:38px;display:grid;place-items:center;border-right:1px solid var(--ln);color:var(--mu);font-style:normal}
.pill .ci{width:46px;height:46px;border-radius:14px;background:color-mix(in srgb,var(--ac) 16%,transparent);display:grid;place-items:center;color:var(--ac)}
.pill .tx{text-align:left}
.pill b{display:block;font-size:26px;line-height:1;font-family:'JetBrains Mono',monospace}
.pill small{font-size:12px;letter-spacing:.14em;color:var(--mu);font-weight:800}
.pill .ar{color:var(--ac);font-size:18px}
.dov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:flex;justify-content:flex-end}
.drw{width:min(92vw,480px);height:100%;background:var(--bg);border-left:1px solid var(--ln);display:flex;flex-direction:column;animation:slin .22s ease-out}
@keyframes slin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--ln)}
.dh b{display:flex;align-items:center;gap:10px;font-size:20px}
.dh b svg{color:var(--ac)}
.cnt{border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent);border-radius:99px;padding:2px 11px;font-size:13px;color:var(--ac)}
.dbd{flex:1;overflow:auto;padding:18px 16px;display:grid;gap:12px;align-content:start}
.di{display:flex;gap:14px;align-items:center;background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:14px}
.di>div{flex:1;min-width:0}
.dic{width:46px;height:46px;border-radius:12px;background:color-mix(in srgb,var(--ac) 14%,transparent);display:grid;place-items:center;color:var(--ac);flex:none}
.trash{background:0;border:0;color:var(--mu);cursor:pointer;padding:8px}
.df{padding:16px;border-top:1px solid var(--ln);display:grid;gap:12px}
.dt{display:flex;justify-content:space-between;align-items:center;background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;color:var(--mu);letter-spacing:.1em}
.dt b{color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0}
.cth{font-family:'Playfair Display',serif;font-size:26px;margin:28px 0 12px;display:flex;align-items:center;gap:14px}
.cth:after{content:"";flex:1;height:1px;background:var(--ln)}
.hrow{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 16px;-webkit-overflow-scrolling:touch}
.hrow .pc{flex:0 0 min(72vw,260px);scroll-snap-align:start}
.orow{display:grid;gap:8px;background:var(--p2);border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:10px}
.orow .in{padding:12px 14px;font-size:15px;border-radius:12px}
@media(prefers-reduced-motion:reduce){.drw{animation:none}}
.brand{white-space:nowrap}
@media(max-width:560px){.brand{font-size:17px;gap:8px}.brand .lg{width:42px;height:42px;font-size:12px}}

<script>
window.addEventListener('error',function(e){var d=document.createElement('div');d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:999;background:#7a1a1a;color:#fff;padding:12px;border-radius:12px;font:13px monospace';d.textContent='Erreur : '+e.message+' (ligne '+e.lineno+')';document.body.appendChild(d)});
/* ============ Utilitaires ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(Number(n)||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const hs=s=>{let h=5381;for(const c of String(s))h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};
const dt=t=>new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
const mem={};
const st={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return mem['s'+k]??null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){mem['s'+k]=v}},del(k){try{sessionStorage.removeItem(k)}catch(e){delete mem['s'+k]}}};
const IC={home:'<path d="M3 11l9-8 9 8v10H3z"/>',cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l3 12h11l2-8H6"/>',wallet:'<rect x="2" y="6" width="20" height="14" rx="3"/><path d="M16 13h3M2 10h20"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',swap:'<path d="M4 8h15l-4-4M20 16H5l4 4"/>',book:'<path d="M2 4h7a3 3 0 013 3v13a2 2 0 00-2-2H2zM22 4h-7a3 3 0 00-3 3v13a2 2 0 012-2h8z"/>',box:'<path d="M12 2l9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',out:'<path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',card:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',wa:'<path d="M3 21l1.6-5A8.5 8.5 0 1112 20.5a8.4 8.4 0 01-4-1z"/><path d="M9 9c0 3 3 6 6 6l1.5-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z"/>'};

/* ============ Données ============ */
let db={site:{name:'NEKTA STORE',color:'#483D8B',logo:'',tagline:''},settings:{whatsapp:'',natcash:'',moncash:''},products:[],news:[],champTitle:'',champ:[],stats:{users:0,orders:0},me:null,isAdmin:false,users:[],orders:[],proofs:[],txs:[],sells:[],workers:[]};
let TOKEN=st.get('max_tok')||'',ATOK=ss.get('max_atok')||'',ADM=false;
async function api(name,body){if(window.LOCAL_API){try{return await window.LOCAL_API(name,body||{},TOKEN,ATOK)}catch(e){throw new Error(e&&e.message?e.message:'Erreur.')}}let r;try{r=await fetch('/api/'+name,{method:'POST',headers:{'Content-Type':'application/json','X-Token':TOKEN,'X-Admin':ATOK},body:JSON.stringify(body||{})})}catch(e){throw new Error('Connexion au serveur impossible.')}
 let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'Erreur serveur.');return j}
async function refresh(){try{const j=await api('state');db=j;ADM=!!j.isAdmin;if(!j.me&&TOKEN){TOKEN='';st.del('max_tok')}if(!j.isAdmin&&ATOK){ATOK='';ss.del('max_atok')}applyColor()}catch(e){toast(e.message,'err')}}
async function adm(name,body,msg){try{await api('admin/'+name,body);await refresh();if(msg)toast(msg);route();return true}catch(e){toast(e.message,'err');await refresh();route();return false}}
const IMGW=window.LOCAL_API?640:900;
const imgP=(f,W,Q)=>new Promise(ok=>readImg(f,ok,W,Q));
const prod=id=>db.products.find(p=>p.id===id);

function brandH(){const p=SN().trim().split(' ');return esc(p[0])+(p.length>1?' <b>'+esc(p.slice(1).join(' '))+'</b>':'')}
function logoH(){const l=db.site.logo;return l?`<span class="lg" style="background:#fff url('${esc(l)}') center/cover"></span>`:`<span class="lg">${esc(SN().split(' ')[0].slice(0,5).toUpperCase())}</span>`}
function hueOf(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 250;let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=Math.round(h*60);return h<0?h+360:h}
function applyColor(){const c=/^#[0-9a-f]{6}$/i.test(db.site.color)?db.site.color:'#483D8B';const st2=document.documentElement.style;const h=hueOf(c);st2.setProperty('--c',c);st2.setProperty('--acd','hsl('+h+' 85% 76%)');st2.setProperty('--acd2','hsl('+h+' 90% 88%)');document.title=SN()}

/* ============ UI helpers ============ */

function artH(p,c=''){const a=p.art||['#483D8B','#241f4a','🎮'];if(p.img)return`<div class="art ${c}" style="background-image:url('${esc(p.img)}')"></div>`;return`<div class="art ${c}" style="background:linear-gradient(135deg,${a[0]},${a[1]})">${esc(a[2])}</div>`}
function rangeOf(p){let v=[];if(p.kind==='listing')v=p.items.map(i=>i.p);else if(p.kind==='offers')v=(p.offers||[]).map(o=>o.p);else if(p.kind==='recharge')return'Variable';else if(p.kind==='game')return'25 - 4000 HTG';if(!v.length)return'Bientôt';const a=Math.min(...v),b=Math.max(...v);return a===b?fmt(a)+' HTG':fmt(a)+' - '+fmt(b)+' HTG'}
const TIERS=[[10,1],[20,2],[40,3],[80,4],[100,6],[200,8],[400,10],[600,12],[1000,20]];
const feeOf=a=>(TIERS.find(t=>a<=t[0])||[0,0])[1];

 modal(`<h3>Passer commande</h3><div class="list">${items.map(i=>`<div class="it"><b>${esc(i.name)}</b><span class="mu">${esc(i.label)}</span><span class="pr">${fmt(i.price)} HTG</span></div>`).join('')}</div>

 <p class="hint">Ton solde : ${fmt(u.bal)} HTG</p>
 ${ok?`<label class="lab">Code promo d'un agent (optionnel)</label><input id="promo" class="in" value="${esc(u.refBy||'')}" placeholder="Code de ton agent">

 <div class="acts"><button class="btn pri" data-act="gowallet">Faire un dépôt</button><button class="btn" data-act="close">Annuler</button></div>`}`)}
async function finishOrder(mode){const {items,fromCart}=CK;const promo=$('#promo')?$('#promo').value.trim():'';
 try{const r=await api('order',{items:items.map(i=>({pid:i.pid,sel:i.sel,amt:i.amt,idx:i.idx,data:i.data})),promo,pay:mode});

 catch(e){toast(e.message,'err')}}

 $('#mdl').innerHTML=`<div class="dov" data-act="close"><aside class="drw" data-act="noop"><div class="dh"><b>${ic('cart',22)} Panier <span class="cnt">${c.length}</span></b><button class="ico" data-act="close" aria-label="Fermer">✕</button></div>
 <div class="dbd">${c.length?c.map((i,n)=>`<div class="di"><span class="dic">${ic('box',20)}</span><div><b>${esc(i.name)}</b><div class="mu" style="font-size:13px">${esc(i.label)}</div><span class="pr" style="font-size:14px">${fmt(i.price)} <small>HTG</small></span></div><button class="trash" data-act="rmdrw" data-i="${n}" aria-label="Retirer">${ic('trash',20)}</button></div>`).join(''):'<p class="mu" style="padding:20px">Ton panier est vide.</p>'}</div>

 <label class="lab">Numéro de téléphone</label><div class="iw">${ic('phone',20)}<input id="a_ph" class="in" type="tel" inputmode="tel" placeholder="+509 37 00 00 00" autocomplete="tel"></div>

/* ============ Router ============ */
let LASTH='';
function route(){const u=me();const same=LASTH===location.hash;const y=window.scrollY;LASTH=location.hash;if(!u){authView();window.scrollTo(0,0);return}
 const [,r='',a='']=(location.hash||'#/').split('/');
 const V={'':homeV,shop:shopV,product:()=>productV(decodeURIComponent(a)),cart:cartV,wallet:walletV,history:histV,transfer:transV,tutos:tutosV,sell:sellV,game:gameV,profile:profV,admin:adminV,worker:workerV,agent:assistV};
 const out=(V[r]||homeV)();if(out===null)return;shell(out,['','shop','wallet','history','transfer'].includes(r)?r:'');if(r==='product')updTotal();window.scrollTo(0,same?y:0);if(!u.phone)phoneModal()}
window.addEventListener('hashchange',async()=>{closeM();await refresh();route()});
/* ============ Actions ============ */
const ACT={
 theme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';st.set('max_th',d.dataset.theme)},
 close(){closeM()},
 askok(){const f=window._ask;const v=$('#askv').value;closeM();f&&f(v)},
 atab(t){AU={tab:t.dataset.t,step:1,email:''};authView()},
 eye(t){const i=t.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password'},
 async login(){try{const r=await api('login',{email:$('#a_em').value.trim().toLowerCase(),pw:$('#a_pw').value});TOKEN=r.token;st.set('max_tok',TOKEN);await refresh();location.hash='#/';route()}catch(e){toast(e.message,'err')}},
 async register(){const ph=cleanPhone($('#a_ph').value);if(!ph)return toast('Entre un numéro de téléphone valide.','err');const n=$('#a_nm').value.trim(),e=$('#a_em').value.trim().toLowerCase(),p=$('#a_pw').value;
  if(n.length<2)return toast("Entre un nom d'utilisateur.",'err');if(!/^\S+@\S+\.\S+$/.test(e))return toast('Email invalide.','err');if(p.length<6)return toast('Mot de passe : 6 caractères minimum.','err');
  try{const r=await api('register',{name:n,email:e,pw:p,phone:ph,ref:st.get('max_ref')||''});TOKEN=r.token;st.set('max_tok',TOKEN);await refresh();location.hash='#/';route();toast('Bienvenue '+n+' !')}catch(x){toast(x.message,'err')}},
 gsign(){const id=db.googleId;if(!id)return toast('Connexion Google non configurée sur le serveur.','err');
  const go=()=>{google.accounts.id.initialize({client_id:id,callback:async r=>{try{const j=await api('google',{credential:r.credential,ref:st.get('max_ref')||''});TOKEN=j.token;st.set('max_tok',TOKEN);await refresh();location.hash='#/';route()}catch(e){toast(e.message,'err')}}});google.accounts.id.prompt()};
  if(window.google&&google.accounts)go();else{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=go;document.head.appendChild(s)}},
 async logout(){try{await api('logout')}catch(e){}TOKEN='';st.del('max_tok');ATOK='';ss.del('max_atok');AU={tab:'login',step:1,email:''};await refresh();location.hash='#/';route()},
 cat(t){CAT=t.dataset.c;route()},
 pick(t){PS.sel=+t.dataset.i;updTotal()},
 buynow(t){const p=prod(t.dataset.id);const it=collect(p);if(it){addToCart(it);cartDrawer()}},
 buyitem(t){const p=prod(t.dataset.id),i=+t.dataset.i,it=p.items[i];addToCart({pid:p.id,idx:i,name:p.name+' — '+it.t,label:it.d||it.t,price:it.p,data:{}});cartDrawer()},
 addcart(t){const p=prod(t.dataset.id);const it=collect(p);if(!it)return;addToCart(it);toast('Ajouté au panier.')},
 ckwallet(){if(CK.busy)return;CK.busy=true;finishOrder('wallet').finally(()=>{if(CK)CK.busy=false})},
 ckmanual(){if(CK.busy)return;CK.busy=true;finishOrder('manual').finally(()=>{if(CK)CK.busy=false})},
 noop(){},
 async savephone(){const ph=cleanPhone($('#ph_in').value);if(!ph)return toast('Numéro invalide (8 à 15 chiffres).','err');try{await api('phone',{phone:ph});await refresh();closeM();toast('Numéro enregistré.');route()}catch(e){toast(e.message,'err')}},
 gowallet(){closeM();location.hash='#/wallet'},
 gohist(){closeM();location.hash='#/history'},
 cartopen(){cartDrawer()},
 drwfull(){closeM();location.hash='#/cart'},
 drwpay(){const c=CART();closeM();if(c.length)checkout(c,true)},
 rmdrw(t){const c=CART();c.splice(+t.dataset.i,1);setCart(c);cartDrawer();refreshBadge()},
 rmcart(t){const c=CART();c.splice(+t.dataset.i,1);setCart(c);route()},
 paycart(){const c=CART();if(c.length)checkout(c,true)},
 tuto(t){const p=prod(t.dataset.id);modal(`<h3>${esc(p.name)}</h3><p style="white-space:pre-line">${esc(p.tuto)}</p><div class="acts"><button class="btn" data-act="close">Fermer</button></div>`)},
 async proof(){const a=parseInt($('#p_amt').value),r=$('#p_ref').value.trim(),m=$('#p_m').value;if(!(a>0)||!r)return toast('Montant et ID de transaction obligatoires.','err');if(a<db.settings.minDeposit)return toast('Montant minimum : '+fmt(db.settings.minDeposit)+' HTG.','err');
  const f=$('#p_img').files[0];const img=f?await imgP(f,640,.6):'';
  try{await api('proof',{amt:a,method:m,ref:r,img});await refresh();route();const u=me();
   modal(`<h3>Dépôt enregistré ✅</h3><div class="note">Dernière étape : appuie sur le bouton pour prévenir l'admin sur WhatsApp, puis envoie ta capture de paiement dans la conversation. Ton solde sera crédité après vérification.</div><div class="acts"><a class="btn pri" href="${esc(waLink(db.settings.whatsapp,depositText(u,a,m,r)))}" target="_blank" rel="noopener">Envoyer sur WhatsApp</a><button class="btn" data-act="close">Fermer</button></div>`)}catch(e){toast(e.message,'err')}},
 async transfer(){const a=parseInt($('#t_amt').value);if(!(a>=100))return toast('Montant minimum : 100 HTG.','err');
  try{const r=await api('transfer',{amt:a,to:$('#tq').value});toast(fmt(a)+' HTG envoyés à '+r.name+'.');await refresh();route()}catch(e){toast(e.message,'err')}},
 async saveprof(){const n=$('#pf_n').value.trim(),e=$('#pf_e').value.trim().toLowerCase();if(n.length<2||!/^\S+@\S+\.\S+$/.test(e))return toast('Nom ou email invalide.','err');const ph=cleanPhone($('#pf_p').value);if(!ph)return toast('Numéro de téléphone invalide.','err');
  try{await api('profile',{name:n,email:e,phone:ph});await refresh();toast('Profil enregistré.');route()}catch(x){toast(x.message,'err')}},
 async sell(){const g=$('#s_g').value.trim(),d=$('#s_d').value.trim(),p=parseInt($('#s_p').value),w=$('#s_w').value.trim();if(!g||!d||!(p>0)||!w)return toast('Remplis tous les champs obligatoires.','err');
  const f=$('#s_i').files[0];const img=f?await imgP(f,640,.6):'';
  try{await api('sell',{game:g,details:d,price:p,wa:w,img});toast('Demande envoyée.');location.hash='#/shop'}catch(e){toast(e.message,'err')}},
 async spin(){const b=parseInt($('#bet').value);if(!(b>=25&&b<=4000))return toast('Mise entre 25 et 4000 HTG.','err');if(me().bal<b)return toast('Solde insuffisant.','err');
  $('#spinb').disabled=true;const E=['🎡','💰','🍀','⭐','🔥'];let n=0;const iv=setInterval(()=>{$('#wh').textContent=E[n++%E.length]},110);let r;
  try{r=await api('spin',{bet:b})}catch(e){clearInterval(iv);$('#spinb').disabled=false;return toast(e.message,'err')}
  setTimeout(()=>{clearInterval(iv);db.me.bal=r.bal;$('#wh').textContent=r.m+'×';$('#gbal').innerHTML=fmt(r.bal)+' <small>HTG</small>';$('#spinb').disabled=false;toast(r.win>b?'Gagné '+fmt(r.win)+' HTG !':r.win===b?'Mise récupérée.':r.win>0?'Tu récupères '+fmt(r.win)+' HTG.':'Perdu. Retente ta chance.')},1100)},
 copy(t){navigator.clipboard?.writeText(t.dataset.v);toast('Lien copié.')},
 async refuse(t){try{await api('order.refuse',{id:t.dataset.id});await refresh();route()}catch(e){toast(e.message,'err')}},
 async deliver(t){try{await api('deliver',{id:t.dataset.id});await refresh();route()}catch(e){toast(e.message,'err')}},
 paid(t){adm('order.paid',{id:t.dataset.id})},
 refund(t){adm('order.cancel',{id:t.dataset.id})},
 secret(){ACT._n=(ACT._n||0)+1;clearTimeout(ACT._t);ACT._t=setTimeout(()=>ACT._n=0,2500);if(ACT._n>=5){ACT._n=0;if(ADM)location.hash='#/admin';else codeModal()}},
 async 'admin-ok'(){try{const r=await api('admin/login',{code:$('#adc').value});ATOK=r.adminToken;ss.set('max_atok',ATOK);closeM();await refresh();location.hash='#/admin';route()}catch(e){toast(e.message,'err')}},
 async admout(){ATOK='';ss.del('max_atok');await refresh();location.hash='#/';route()},
 async at(t){AT=t.dataset.t;await refresh();route()},
 newprod(){prodModal('')},editprod(t){prodModal(t.dataset.id)},
 addrow(){$('#e_rows').insertAdjacentHTML('beforeend',rowH($('#e_k').value))},
 rmrow(t){t.closest('.orow').remove()},
 async saveprod(t){const old=t.dataset.id?prod(t.dataset.id):null;const name=$('#e_n').value.trim();if(!name)return toast('Nom obligatoire.','err');
  const kind=$('#e_k').value;const rows=[];for(const r of document.querySelectorAll('#e_rows .orow')){const o={};r.querySelectorAll('input:not([type=file])').forEach(i=>o[i.dataset.k]=(i.dataset.full&&i.value==='[image importée]')?i.dataset.full:i.value.trim());const rf=r.querySelector('input[type=file]');if(rf&&rf.files[0])o.img=await imgP(rf.files[0],IMGW,.72);rows.push(o)}
  const iv=$('#e_i').value.trim();const f=$('#e_file').files[0];let img=iv==='[image importée]'?'[keep]':iv;if(f)img=await imgP(f,IMGW,.72);
  const product={id:old?old.id:undefined,name,cat:$('#e_c').value.trim(),kind,desc:$('#e_d').value.trim(),tuto:$('#e_t').value.trim(),img,rate:$('#e_r').value,bonusEvery:$('#e_be').value,bonusText:$('#e_bt').value.trim(),
   art:[(old&&old.art||[])[0]||'#483D8B',(old&&old.art||[])[1]||'#241f4a',$('#e_a').value.trim()||'🎮'],
   fields:$('#e_f').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>({l:l.replace(/\*$/,'').trim(),req:/\*$/.test(l)?1:0})),
   items:kind==='listing'?rows.map(r=>({t:r.t,d:r.d||'',p:r.p,img:r.img||'',bonus:{every:r.be,text:r.bt}})):undefined,offers:kind==='offers'?rows.map(r=>({l:r.l,p:r.p,g:r.g||'',bonus:{every:r.be,text:r.bt}})):undefined};
  if(await adm('product.save',{product},'Produit enregistré.'))closeM()},
 async delprod(t){if(!window.confirm('Supprimer ce produit ?'))return;adm('product.delete',{id:t.dataset.id})},
 news(t){adm('news.toggle',{id:t.dataset.id})},
 approve(t){const id=t.dataset.id;const a=parseInt($('#pa_'+id).value);if(!(a>0))return toast('Montant invalide.','err');adm('proof.approve',{id,amt:a})},
 reject(t){adm('proof.reject',{id:t.dataset.id})},
 credit(t){const u=db.users.find(x=>x.id===t.dataset.id);ask('Créditer / débiter '+u.name,'Montant en HTG (négatif pour débiter)',v=>{const a=parseInt(v);if(a)adm('user.credit',{id:u.id,amt:a})})},
 rename(t){const u=db.users.find(x=>x.id===t.dataset.id);ask('Renommer','Nouveau nom',v=>{if(v.trim().length>1)adm('user.rename',{id:u.id,name:v.trim()})},u.name)},
 resetpw(t){const u=db.users.find(x=>x.id===t.dataset.id);ask('Mot de passe de '+u.name,'Nouveau mot de passe temporaire (6 caractères min.)',v=>{adm('user.resetpw',{id:u.id,pw:v},'Mot de passe changé.')})},
 tm(t){TM=t.dataset.m;route()},
 async withdraw(){const a=parseInt($('#t_amt').value);if(!(a>=100))return toast('Montant minimum : 100 HTG.','err');const name=$('#w_name').value.trim(),num=$('#w_num').value.trim();if(!name||!cleanPhone(num))return toast('Entre le nom et le numéro du compte '+TM+'.','err');
  try{await api('withdraw',{amt:a,method:TM,name,number:num});toast("Demande envoyée. L'admin va t'envoyer l'argent.");await refresh();route()}catch(e){toast(e.message,'err')}},
 async assistapply(){try{await api('agent.apply',{msg:$('#ap_m')?$('#ap_m').value:''});toast('Demande envoyée.');await refresh();route()}catch(e){toast(e.message,'err')}},
 async wonline(t){try{await api('worker.settings',{online:t.dataset.v==='1'});await refresh();route()}catch(e){toast(e.message,'err')}},
 async wphone(){try{await api('worker.settings',{phone:$('#w_ph').value});await refresh();toast('Numéro enregistré.');route()}catch(e){toast(e.message,'err')}},
 async notifread(){try{await api('notif.read');await refresh();route()}catch(e){}},
 appaccept(t){const a=db.apps.find(x=>x.id===t.dataset.id);ask('Accepter '+a.name,'Code promo de cet agent (vide = code automatique)',v=>adm('app.accept',{id:a.id,code:v},'Agent accepté.'))},
 appreject(t){adm('app.reject',{id:t.dataset.id})},
 delworker(t){if(window.confirm('Retirer cet agent ?'))adm('worker.del',{uid:t.dataset.u})},
 wdone(t){adm('withdraw.done',{id:t.dataset.id},'Marqué payé.')},
 wreject(t){adm('withdraw.reject',{id:t.dataset.id},'Refusé et remboursé.')},
 bdone(t){adm('bonus.done',{id:t.dataset.id},'Bonus marqué livré.')},
 champtitle(){adm('champ.title',{title:$('#c_t').value},'Titre enregistré.')},
 async addteam(){const f=$('#c_f').files[0];const logo=f?await imgP(f,300,.85):'';await adm('champ.add',{name:$('#c_n').value,logo,pts:$('#c_p').value})},
 async teamsave(t){const i=+t.dataset.i;const f=$('#cf_'+i).files[0];const body={i,name:$('#cn_'+i).value,pts:$('#cp_'+i).value};if(f)body.logo=await imgP(f,300,.85);await adm('champ.edit',body,'Clan enregistré.')},
 pts(t){adm('champ.pts',{i:+t.dataset.i,d:+t.dataset.d})},
 delteam(t){adm('champ.del',{i:+t.dataset.i})},
 sellok(t){adm('sell.ok',{id:t.dataset.id})},
 async savesite(){const lv=$('#si_l').value.trim();const f=$('#si_f').files[0];let logo=lv==='[logo importé]'?'[keep]':lv;if(f)logo=await imgP(f,300,.85);
  await adm('site.save',{site:{name:$('#si_n').value,tagline:$('#si_t').value,color:$('#si_c').value,logo},settings:{whatsapp:$('#st_w').value,natcash:$('#st_n').value,moncash:$('#st_m').value,natcashName:$('#st_nn').value,moncashName:$('#st_mn').value,minDeposit:$('#st_md').value}},'Site mis à jour.')},
 async savecode(){const c=$('#st_c').value;if(c.length<6)return toast('Code : 6 caractères minimum.','err');try{await api('admin/code.change',{code:c});ATOK='';ss.del('max_atok');toast('Code admin changé. Reconnecte-toi.');await refresh();location.hash='#/';route()}catch(e){toast(e.message,'err')}}
};
function readImg(file,cb,W=640,Q=.6){const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,W/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',Q))};im.onerror=()=>cb('');im.src=e.target.result};r.readAsDataURL(file)}
document.addEventListener('click',e=>{const el=e.target.nodeType===1?e.target:e.target.parentElement;const t=el&&el.closest('[data-act]');if(!t)return;if(t.classList.contains('ov')&&e.target!==t)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t,e)}});
document.addEventListener('input',e=>{
 if(e.target.id==='amt')updTotal();
 if(e.target.id==='tq'){clearTimeout(window._tqt);const q=e.target.value;window._tqt=setTimeout(async()=>{const h=$('#thint');if(!h)return;if(!q.trim()){h.textContent='Tape un nom, un email ou un code — le solde sera crédité instantanément.';return}try{const r=await api('lookup',{q});h.textContent=r.users.length===1?'→ '+r.users[0].name+' (ID '+r.users[0].id+')':r.users.length>1?"Plusieurs comptes : utilise l'ID ou le code client.":'Aucun compte trouvé.'}catch(x){}},300)}
 if(e.target.id==='uq'){AQ=e.target.value;const p=e.target.selectionStart;route();const i=$('#uq');if(i){i.focus();i.setSelectionRange(p,p)}}});
document.addEventListener('change',e=>{if(e.target.id==='e_k')kindUI()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const a=e.target.id;if(a==='a_pw'||a==='a_em'){const m={login:'login',register:'register'}[AU.tab];if(m)ACT[m]()}if(a==='askv')ACT.askok();if(a==='ph_in')ACT.savephone();if(a==='adc')ACT['admin-ok']()}if(e.key==='Escape'&&me()&&me().phone)closeM()});
document.documentElement.dataset.theme=st.get('max_th')||'dark';
(async()=>{await refresh();route()})();
